<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{name}}: eye-image concept</title>
<meta name="description" content="{{lede}} {{concept}}">
<link rel="canonical" href="{{url}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%235468e8'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="back" href="{{hubHref}}"><span aria-hidden="true">←</span> {{hubLabel}}</a>
  <span class="chip">{{status}}</span>
</header>
<main class="layout">
  <section class="text">
    <h1>{{name}}</h1>
    <p class="lede">{{lede}}</p>
    <ol class="steps">{{steps}}</ol>
    <p class="concept"><strong>{{concept}}</strong> {{limits}}</p>
    <a class="action" href="{{source}}" target="_blank" rel="noopener noreferrer">Source on GitHub <span aria-hidden="true">↗</span><span class="sr">(opens in a new tab)</span></a>
  </section>
  <figure class="phone">
    <video src="assets/demo.mp4" poster="assets/demo-poster.jpg" muted loop playsinline autoplay preload="metadata" width="480" height="1034" aria-label="The OptoLab app: an eye image is captured, sent for review, and a report shows a main insight."></video>
    <figcaption>Screen recording of the prototype. {{concept}}</figcaption>
  </figure>
</main>
</body>
</html>
